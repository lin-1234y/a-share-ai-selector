[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-ai-selector"
version = "0.1.1"
description = "Local A-share AI stock selector and analysis dashboard"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "akshare>=1.16",
  "tushare>=1.4",
  "baostock>=0.9.1",
]

[project.scripts]
stock-selector = "stock_selector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
